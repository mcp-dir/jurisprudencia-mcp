# Smithery configuration for Jurisprudência
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_jurisprudencia

name: jurisprudencia-mcp
displayName: "Jurisprudência"
description: >
  Pesquisa de jurisprudência em 17 tribunais brasileiros, do STF e dos superiores aos regionais federais, ao CARF e a onze tribunais de justiça estaduais. Cada decisão vem com órgão julgador, relator, data, o trecho exato que casou a busca e o link no site oficial. Grátis, sem login, hospedado pela plataforma.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/jurisprudencia-mcp
repository: https://github.com/mcp-dir/jurisprudencia-mcp

tags:
  - jurisprudencia
  - case-law
  - brazil
  - stf
  - stj
  - tst
  - tribunais
  - acordaos
  - sumulas
  - legal
  - advocacia
  - free
  - read-only
  - no-auth

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_jurisprudencia

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_jurisprudencia/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
